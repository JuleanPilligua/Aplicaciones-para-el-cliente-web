<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes - LocalStorage y JSON</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Registro de Estudiantes</h2>
        <form id="formulario">
            <div class="campo">
                <label>Cédula:</label>
                <input type="text" id="cedula" placeholder="10 dígitos">
            </div>

            <div class="campo">
                <label>Apellidos:</label>
                <input type="text" id="apellidos" placeholder="Ej. Pérez Zambrano">
            </div>

            <div class="campo">
                <label>Nombres:</label>
                <input type="text" id="nombres" placeholder="Ej. Juan Carlos">
            </div>

            <div class="campo">
                <label>Dirección:</label>
                <input type="text" id="direccion" placeholder="Ej. Calle 12 y Av. 4">
            </div>

            <div class="campo">
                <label>Teléfono:</label>
                <input type="text" id="telefono" placeholder="Ej. 0991234567">
            </div>

            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com">
            </div>

            <div class="campo">
                <label>Facultad:</label>
                <input type="text" id="facultad" placeholder="Ej. Informática">
            </div>

            <div class="campo">
                <label>Nivel:</label>
                <input type="number" id="nivel" min="1" max="10" placeholder="1 al 10">
            </div>

            <div class="campo">
                <label>Paralelo:</label>
                <input type="text" id="paralelo" maxlength="1" placeholder="Ej. A">
            </div>

            <button type="submit">Guardar Estudiante</button>
        </form>

        <hr>

        <h3>Estudiantes en LocalStorage</h3>
        <table id="tabla">
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Apellidos</th>
                    <th>Nombres</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Facultad</th>
                    <th>Nivel</th>
                    <th>Paralelo</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaEstudiantes"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
