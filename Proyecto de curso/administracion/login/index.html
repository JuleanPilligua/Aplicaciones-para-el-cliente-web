<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="formulario">

        <div class="header-formulario">
            <div class="logo-nombre-header-formulario">
                <img src="../img/logo-uleam.png" alt="logo de la uleam" class="img-logo-header-formulario">
                <p class="p-nombre-header-formulario">ULEAM</p>
            </div>
            <p>Universidad Laica Eloy Alfaro de Manabí</p>
        </div>

        <div class="presentacion-formulario">
            <h1 class="h1-presentacion-formulario">Sistema de Gestión de Horarios</h1>
            <p class="p-presentacion-formulario">Ingresa tus credenciales institucionales para continuar</p>
        </div>

        <form id="registroForm">
            <div class="input-group">
                <label for="cedula-correo">Correo electrónico</label>
                <div class="input-contenedor">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D7588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-input"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
                    <input type="text" id="cedula-correo" placeholder="Ej. ecedula@live.uleam.edu.ec">
                </div>
                <span class="error" id="errorNombre"></span>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-contenedor">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D7588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-input"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" /><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /></svg>
                    <input type="password" id="password" placeholder="••••••••••">
                </div>
                <span class="error" id="errorPass"></span>
            </div>

            <button type="submit">
                Iniciar Sesión
            </button>
            <p>
                Soporte TIC · soporte@uleam.edu.ec
            </p>
        </form>

    </div>

    <script src="/login/script.js"></script>
</body>
</html>
